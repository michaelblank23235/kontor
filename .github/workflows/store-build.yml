name: Kontor MSIX Bundle
on:
  workflow_dispatch:
  push:
    paths:
      - 'Kontor-Windows/**'
      - '.github/workflows/store-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Kontor-Windows
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Test application
        run: npm test
      - name: Build Store bundle
        shell: powershell
        run: ./scripts/build-store.ps1
      - name: Upload Store bundle
        uses: actions/upload-artifact@v7
        with:
          name: Kontor-Store-x64
          path: Kontor-Windows/release/store/*
          if-no-files-found: error
          retention-days: 14
